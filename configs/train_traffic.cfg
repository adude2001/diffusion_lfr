# save options
out: ./out/train_traffic_out

# model family
model_family: diffusion
diff_timesteps: 100
diff_sampling_timesteps: 20
diff_objective: pred_v
cfg_drop_prob: 0.1
cfg_guidance_scale: 1.0

# data options
data_dir: ./data/nuscenes
data_version: mini
data_noise_std: 0.01
batch_size: 64
num_workers: 0

# optim and loss
epochs: 100
lr: 1e-4
loss_kl: 0.004
kl_anneal_end: 20
loss_recon: 1.0
loss_veh_coll_prior: 0.0
loss_env_coll_prior: 0.1